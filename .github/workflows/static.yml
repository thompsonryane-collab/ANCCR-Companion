name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate index.html
        id: site
        run: |
          f=$(find . -name index.html -not -path './.git/*' | sort | head -1)
          [ -n "$f" ] || { echo "index.html not found"; exit 1; }
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Publishing from $(dirname "$f")"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
