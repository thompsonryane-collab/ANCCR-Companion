<title>ANCCR AI Companion — learn the hub, trace the data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --void:#141c27; --card:#0e1824; --chrome:#0e1520; --border:#1a2d42; --border2:#27405c;
  --sage:#4db88a; --cyan:#18d4f8; --amber:#e0a84e; --red:#e05555; --violet:#a07cf0;
  --tx:#d2e4f4; --txh:#f6faff; --txd:#86a6c4; --txf:#6886a4;
  --sheet:#0f1a28; --sheet2:#132236; --pill:#1a2d42;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  --dsp:'Orbitron',ui-monospace,monospace;
  --raj:'Rajdhani','Avenir Next Condensed','Segoe UI',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --void:#e9eef4; --card:#ffffff; --chrome:#f3f6fa; --border:#d3dce6; --border2:#b9c6d4;
  --sage:#1f8a5c; --cyan:#0b7fa8; --amber:#b4731a; --red:#c43a3a; --violet:#6d4fcf;
  --tx:#26354a; --txh:#0e1824; --txd:#4f647c; --txf:#7a8ea4;
  --sheet:#ffffff; --sheet2:#f3f6fa; --pill:#e4ebf2; color-scheme:light;
}}
:root[data-theme="light"]{
  --void:#e9eef4; --card:#ffffff; --chrome:#f3f6fa; --border:#d3dce6; --border2:#b9c6d4;
  --sage:#1f8a5c; --cyan:#0b7fa8; --amber:#b4731a; --red:#c43a3a; --violet:#6d4fcf;
  --tx:#26354a; --txh:#0e1824; --txd:#4f647c; --txf:#7a8ea4;
  --sheet:#ffffff; --sheet2:#f3f6fa; --pill:#e4ebf2; color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html,body{height:100%;background:var(--void)}
body{font-family:var(--raj);color:var(--tx);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cyan);text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}

/* phone frame on wide screens */
#phone{position:relative;width:100%;height:100%;background:var(--void);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#1b2a3d,#07090e 70%)}
  #phone{width:402px;height:min(874px,96vh);border-radius:54px;box-shadow:0 0 0 10px #0a0d13,0 0 0 12px #2a3340,0 40px 90px rgba(0,0,0,.6);--sat:54px;--sab:28px}
  #phone::before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:50}
  #phone::after{content:'';position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--txd);opacity:.7;z-index:50}
}
/* background grid, same vocabulary as the hub */
#phone .grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(24,212,248,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(24,212,248,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,transparent,#000 15%,#000 85%,transparent)}

/* chrome */
#chrome{position:relative;z-index:5;padding:calc(var(--sat) + 6px) 18px 10px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--chrome) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.wordmark{font-family:var(--dsp);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--txh)}
.wordmark b{color:var(--amber);font-weight:700}
#clock{font-family:var(--mono);font-size:12px;color:var(--txd);margin-left:auto}
.ctl{width:34px;height:34px;border-radius:11px;background:var(--pill);display:grid;place-items:center;color:var(--txd)}
.ctl svg{width:17px;height:17px}

/* views */
#views{position:relative;z-index:2;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(var(--sab) + 28px);display:none;scroll-padding-top:var(--sat)}
.view.on{display:block}
h1{font-family:var(--raj);font-weight:700;font-size:30px;line-height:1.05;color:var(--txh);letter-spacing:-.01em}
h2{font-family:var(--raj);font-weight:700;font-size:21px;color:var(--txh);margin:22px 0 8px}
h3{font-family:var(--raj);font-weight:700;font-size:17px;color:var(--txh);margin:16px 0 4px}
p{margin:6px 0;color:var(--tx)}
.lead{font-size:18px;color:var(--txd);margin-top:8px;max-width:34ch}
.kicker{font-family:var(--mono);font-size:12px;color:var(--amber);margin-bottom:6px}
.callout{margin:16px 0;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--amber)}
.callout p{margin:0;color:var(--tx)}
.hr{height:1px;background:var(--border);margin:20px 0}

/* hub tiles — the v1.7 template */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px;margin-top:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.ico{position:relative;width:74px;height:74px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 6px rgba(0,0,0,.25);transition:transform .14s var(--ease)}
.ico::after{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 55%)}
.tile:active .ico{transform:scale(.93)}
.ico svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.tile .lbl{font-family:var(--raj);font-weight:600;font-size:13px;line-height:1.15;color:var(--tx)}
.tile .code{font-family:var(--mono);font-size:10px;color:var(--txf);letter-spacing:.04em}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-family:var(--mono);font-size:11px;display:grid;place-items:center;border:2px solid var(--void);z-index:2}
.badge.new{background:var(--amber);color:#1a1200}
.ring .ico{box-shadow:0 0 0 3px var(--void),0 0 0 5px var(--amber),0 10px 22px rgba(0,0,0,.35)}

/* sheet */
#dim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;height:92%;background:var(--sheet);border-radius:26px 26px 0 0;transform:translateY(104%);transition:transform .42s var(--ease);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#phone.open #dim{opacity:1;pointer-events:auto}
#phone.open #sheet{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border2);margin:9px auto 0}
.sh-head{display:flex;align-items:center;gap:12px;padding:12px 18px 10px}
.sh-head .ico{width:50px;height:50px;border-radius:15px;flex:none}
.sh-head .ico svg{width:24px;height:24px}
.sh-title{font-family:var(--raj);font-weight:700;font-size:20px;line-height:1.1;color:var(--txh)}
.sh-sub{font-family:var(--mono);font-size:11px;color:var(--txf);margin-top:2px}
.sh-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--pill);display:grid;place-items:center;color:var(--txd);font-size:17px}
.seg{display:flex;gap:2px;margin:4px 14px 10px;padding:3px;border-radius:12px;background:var(--pill)}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-family:var(--raj);font-weight:600;font-size:13.5px;color:var(--txd);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--card);color:var(--txh);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px calc(var(--sab) + 28px)}
.sh-body h3:first-child{margin-top:4px}
.sh-body ul{margin:6px 0 10px 18px}
.sh-body li{margin:4px 0}
.steps{counter-reset:s;margin:8px 0 0}
.steps li{list-style:none;position:relative;padding-left:34px;margin:10px 0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:8px;background:var(--pill);color:var(--amber);font-family:var(--mono);font-size:12px;display:grid;place-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{padding:4px 10px;border-radius:999px;background:var(--pill);font-family:var(--mono);font-size:11.5px;color:var(--txd)}
.pill.ok{color:var(--sage)} .pill.wait{color:var(--amber)} .pill.ext{color:var(--cyan)}
button.pill{border:1px solid var(--border2);cursor:pointer}
button.pill::after{content:' ⌕';opacity:.7}
.dv-head{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.dv-head .back{font-family:var(--raj);font-weight:600;font-size:15px;color:var(--cyan);padding:6px 4px}
.dv-title{font-family:var(--raj);font-weight:700;font-size:18px;color:var(--txh);line-height:1.15}
.dv-sub{font-family:var(--mono);font-size:11px;color:var(--txf);margin-top:2px}
.dv-seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--pill);margin:8px 0}
.dv-seg button{flex:1;padding:7px;border-radius:9px;font-family:var(--raj);font-weight:600;font-size:13.5px;color:var(--txd)}
.dv-seg button[aria-pressed="true"]{background:var(--card);color:var(--txh);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -18px 8px 0;padding-right:18px}
.twrap .tbl{min-width:100%;white-space:nowrap}
.twrap .tbl td{font-size:13px}
.twrap .tbl td.num{text-align:right}
.twrap .tbl .ty{font-family:var(--mono);font-size:11.5px;color:var(--cyan)}
.twrap .tbl .dsc{white-space:normal;min-width:180px;color:var(--txd);font-size:12.5px}
.dv-note{font-size:13px;color:var(--txd);margin:6px 0}
.formula{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;overflow-x:auto;color:var(--tx);white-space:pre}
.formula em{font-style:normal;color:var(--cyan)}
.formula b{font-weight:normal;color:var(--amber)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
.tbl th{text-align:left;font-family:var(--mono);font-size:11px;font-weight:normal;color:var(--txf);padding:6px 6px;border-bottom:1px solid var(--border)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl td.num{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap}
.srcs a{display:block;padding:12px 14px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--tx)}
.srcs a strong{display:block;color:var(--txh);font-weight:600}
.srcs a span{display:block;font-size:14px;color:var(--txd);margin-top:2px}
.srcs a small{display:block;font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:5px;word-break:break-all}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{padding:10px 10px;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.kpi b{display:block;font-family:var(--mono);font-size:20px;color:var(--txh)}
.kpi span{font-size:12.5px;color:var(--txd)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
select,input[type=range]{font:inherit;color:var(--txh);background:var(--pill);border:1px solid var(--border);border-radius:11px;padding:8px 10px;width:100%}
input[type=range]{padding:0;height:34px;accent-color:var(--amber)}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--txf)}
canvas{width:100%;height:120px;display:block;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.err{padding:10px 12px;border-radius:12px;border:1px solid var(--border);border-left:3px solid var(--red);background:var(--card);margin:8px 0;font-size:14.5px}
.err .mini{display:block;margin-bottom:2px;color:var(--red)}
.note{font-size:14px;color:var(--txd)}

/* learn view */
.path{margin-top:14px}
.path .step{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.path .t{font-family:var(--mono);font-size:12px;color:var(--amber);padding-top:4px}
.path strong{display:block;color:var(--txh);font-weight:700;font-size:17px}
.path span{color:var(--txd);font-size:15px}
.path button{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--cyan)}

/* ask view */
.q{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--txh);font-weight:600;font-size:16px}
.q small{display:block;font-weight:500;color:var(--txd);font-size:13.5px;margin-top:3px}
.ans{margin:12px 0;padding:14px;border-radius:16px;background:var(--sheet2);border:1px solid var(--border)}
.ans .who{font-family:var(--mono);font-size:11px;color:var(--amber);margin-bottom:6px}

/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:8px 10px calc(var(--sab) + 6px);background:color-mix(in srgb,var(--chrome) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;color:var(--txf);font-family:var(--raj);font-weight:600;font-size:11.5px}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--amber)}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 56px);transform:translate(-50%,-12px);z-index:40;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border2);font-family:var(--mono);font-size:12px;color:var(--txh);opacity:0;pointer-events:none;transition:all .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* strategy tile and dictionary cross-link */
.bars{margin:10px 0}
.bar{display:grid;grid-template-columns:118px 1fr 40px;gap:8px;align-items:center;margin:7px 0;font-size:13.5px}
.bar .trk{height:10px;border-radius:5px;background:var(--pill);overflow:hidden}
.bar .fil{height:100%;width:0;border-radius:5px;transition:width .9s var(--ease)}
.bar .pct{font-family:var(--mono);font-size:12px;color:var(--txd);text-align:right}
details.card{margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
details.card summary{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;color:var(--txh);font-weight:600;font-size:15.5px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:'›';flex:none;width:24px;height:24px;border-radius:7px;background:var(--pill);color:var(--amber);font-family:var(--mono);font-size:16px;line-height:24px;text-align:center;margin-left:auto;transition:transform .2s var(--ease)}
details.card summary .chip{margin-left:auto}
details.card summary .chip + *,details.card summary .chip ~ ::after{margin-left:8px}
details.card summary:has(.chip)::after{margin-left:8px}
details.card[open] summary::after{transform:rotate(90deg)}
details.card summary .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--pill);color:var(--amber);font-family:var(--mono);font-size:12px;display:grid;place-items:center}
details.card summary .chip{margin-left:auto;flex:none}
details.card .bd{padding:0 14px 12px;color:var(--tx);font-size:14.5px}
details.card .bd p{margin:4px 0}
.chip{padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:10.5px;color:#fff;white-space:nowrap}
.chip.dec{background:var(--sage)} .chip.open{background:var(--amber);color:#1a1200} .chip.task{background:var(--cyan);color:#021018} .chip.frame{background:var(--txf)} .chip.have{background:var(--sage)} .chip.partial{background:var(--amber);color:#1a1200} .chip.gap{background:var(--red)}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filt button{padding:6px 11px;border-radius:999px;background:var(--pill);font-family:var(--raj);font-weight:600;font-size:13px;color:var(--txd)}
.filt button[aria-pressed="true"]{background:var(--txh);color:var(--void)}
.mtx{width:100%;height:auto;display:block;border-radius:14px;background:var(--card);border:1px solid var(--border)}
.mtx circle{cursor:pointer;transition:r .15s}
.mtx circle.sel{stroke:var(--txh);stroke-width:3}
.mtx text{font-family:var(--raj);font-size:11px;fill:var(--txf)}
.mtx-sel{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--sheet2);border:1px solid var(--border);font-size:14.5px;min-height:44px}
.mtx-sel b{color:var(--txh)}
.sprints{display:flex;gap:4px;margin:10px 0 4px}
.sprints button{flex:1;padding:9px 6px;border-radius:11px;background:var(--card);border:1px solid var(--border);font-family:var(--raj);font-weight:700;font-size:13px;color:var(--txd);text-align:left;line-height:1.15}
.sprints button small{display:block;font-family:var(--mono);font-size:10px;font-weight:normal;color:var(--txf)}
.sprints button[aria-pressed="true"]{border-color:var(--c);color:var(--txh);box-shadow:inset 0 -3px 0 var(--c)}
.gantt{margin:8px 0}
.gantt .g{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13.5px;color:var(--tx)}
.gantt .g .t{position:relative;height:8px;border-radius:4px;background:var(--pill)}
.gantt .g .t i{position:absolute;top:0;bottom:0;border-radius:4px}
.act{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start;font-size:14.5px}
.act input{width:22px;height:22px;accent-color:var(--sage);margin-top:1px}
.act .o{display:block;font-family:var(--mono);font-size:11px;color:var(--txf);margin-top:3px}
.sec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;margin:14px 0 0;border-radius:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--c,var(--amber));font-family:var(--raj);font-weight:700;font-size:17px;color:var(--txh)}
.sec:first-of-type{margin-top:6px}
.sec .ct{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:normal;color:var(--c,var(--txf))}
.sec .tg{flex:none;width:24px;height:24px;border-radius:7px;background:var(--pill);color:var(--c,var(--amber));font-family:var(--mono);font-size:16px;line-height:24px;text-align:center;transition:transform .2s var(--ease)}
.sec[aria-expanded="true"] .tg{transform:rotate(90deg)}
.sec[aria-expanded="true"]{border-bottom-left-radius:0;border-bottom-right-radius:0}
.sec-bd{padding:10px 12px 14px;margin:0 0 4px;border:1px solid var(--border);border-top:0;border-left:4px solid var(--c,var(--amber));border-radius:0 0 14px 14px;background:color-mix(in srgb,var(--card) 55%,transparent)}
.sec-bd > .dd-letter:first-child{margin-top:0}
.sec-bd .prog{margin-top:0}
.sec-bd > .risk:first-child{margin-top:0}
.sec-bd .steps{margin-top:0}
.act.done{opacity:.55;text-decoration:line-through}
.prog{height:6px;border-radius:3px;background:var(--pill);margin:8px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage);transition:width .4s var(--ease)}
.risk{margin:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.risk > button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 12px}
.risk .sv{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent);background:var(--c)}
.risk .rt{font-weight:600;color:var(--txh);font-size:15px;line-height:1.25}
.risk .rl{font-family:var(--mono);font-size:10.5px;color:var(--txf);margin-top:3px}
.risk .rl b{font-weight:normal;color:var(--c)}
.risk .tg{flex:none;margin-left:auto;width:22px;height:22px;border-radius:7px;background:var(--pill);color:var(--amber);font-family:var(--mono);font-size:15px;line-height:22px;text-align:center;transition:transform .2s var(--ease)}
.risk > button[aria-expanded="true"] .tg{transform:rotate(90deg)}
.risk .bd{padding:0 12px 12px 32px;font-size:14px;color:var(--tx)}
.risk .bd .lv{display:flex;gap:6px;margin:4px 0 8px}
.risk .bd .mt{font-family:var(--mono);font-size:10.5px;color:var(--txf);margin-bottom:2px}
/* mind map */
.mm-bar{position:sticky;top:-4px;z-index:3;display:flex;gap:6px;align-items:center;margin:0 -18px 10px;padding:10px 18px;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.mm-bar button{padding:7px 12px;border-radius:999px;background:var(--pill);font-family:var(--raj);font-weight:600;font-size:13px;color:var(--txh)}
.mm-bar .mini{margin-left:auto}
#sh-top{position:absolute;right:16px;bottom:calc(var(--sab) + 18px);z-index:5;width:44px;height:44px;border-radius:50%;background:var(--amber);color:#1a1200;box-shadow:0 8px 20px rgba(0,0,0,.4);display:grid;place-items:center;opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
#sh-top.on{opacity:1;transform:none;pointer-events:auto}
#sh-top svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mm{list-style:none;margin:0;padding:0}
.mm ul{list-style:none;margin:0 0 0 14px;padding:0 0 0 14px;border-left:1.5px solid var(--border2)}
.mm li{margin:4px 0;position:relative}
.mm ul li::before{content:'';position:absolute;left:-14px;top:17px;width:10px;height:1.5px;background:var(--border2)}
.mm .nd{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:7px 10px;border-radius:11px;background:var(--card);border:1px solid var(--border);color:var(--tx);font-size:14px;line-height:1.3}
.mm .nd.br{font-weight:700;color:var(--txh);border-left:3px solid var(--c)}
.mm .nd.leaf{background:transparent;border-color:transparent;padding-left:8px;color:var(--txd);cursor:default}
.mm .nd .tg{flex:none;width:20px;height:20px;border-radius:6px;background:var(--pill);color:var(--amber);font-family:var(--mono);font-size:13px;display:grid;place-items:center;margin-top:1px;transition:transform .2s var(--ease)}
.mm .nd[aria-expanded="true"] .tg{transform:rotate(90deg)}
.mm .nd .ct{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--txf);margin-top:3px}
.mm .nd.conc{color:var(--sage)}
.mm .root{font-family:var(--raj);font-weight:700;font-size:17px;color:var(--txh);padding:10px 12px;border-radius:12px;background:var(--sheet2);border:1px solid var(--border);margin-bottom:6px}
.seg{overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 0;min-width:0;font-size:12.5px;padding:8px 4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border-bottom:3px solid transparent;border-radius:9px 9px 6px 6px;white-space:nowrap;letter-spacing:-.01em}
.seg button.seg-ico{flex:0 0 auto;min-width:38px;padding:8px 6px}
.seg button.end{order:9;flex:0 0 auto;min-width:48px}
.seg-search{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:9px;background:var(--card);border:1px solid var(--border)}
.seg-search input{flex:1;min-width:0;background:none;border:0;padding:8px 0;font:inherit;font-size:15px;color:var(--txh);outline:none}
.seg-search input::placeholder{color:var(--txf)}
.seg-search button{color:var(--txf);font-size:13px;padding:4px}
.seg-search:focus-within{border-color:var(--amber)}
.seg button[aria-selected="true"]{border-bottom-color:var(--c,var(--amber))}
.seg button[data-i]{color:color-mix(in srgb,var(--c,var(--txd)) 70%,var(--txd))}

var DV={key:null,mode:'schema',back:null};
function dvRender(){
 var t=DSETS[DV.key]; var rows=t.rows();
 var head='<div class="dv-head"><button class="back" data-dsback="1">‹ Data</button></div><div class="dv-title">'+t.name+'</div><div class="dv-sub">'+t.src+'</div><p class="dv-note">'+t.note+'</p>'+
 '<div class="dv-seg"><button data-dsmode="schema" aria-pressed="'+(DV.mode==='schema')+'">Schema · '+t.cols.length+' fields</button><button data-dsmode="data" aria-pressed="'+(DV.mode==='data')+'">Data · '+rows.length+' rows</button></div>';
 var body;
 if(DV.mode==='schema'){ body='<div class="twrap"><table class="tbl"><tr><th>field</th><th>type</th><th>unit</th><th>description</th></tr>'+t.cols.map(function(c){return '<tr><td><strong>'+c.n+'</strong></td><td class="ty">'+c.t+'</td><td class="ty">'+(c.u||'—')+'</td><td class="dsc">'+c.d+'</td></tr>';}).join('')+'</table></div>'; }
 else { body='<div class="twrap"><table class="tbl"><tr>'+t.cols.map(function(c){return '<th>'+c.n+'</th>';}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(v,i){var num=/number/.test(t.cols[i].t);return '<td class="'+(num?'num':'')+'">'+v+'</td>';}).join('')+'</tr>';}).join('')+'</table></div><p class="note">Sample rows regenerated from the demo rules; real extracts replace them through the Data Drop Zone. Swipe sideways for more columns.</p>'; }
 return head+body;
}
document.addEventListener('click',function(e){var t;
 if(t=e.target.closest('[data-ds]')){ DV.key=t.dataset.ds; DV.mode='schema'; DV.back=shB.innerHTML; shB.innerHTML=dvRender(); shB.scrollTop=0; buzz(); }
 else if(t=e.target.closest('[data-dsmode]')){ DV.mode=t.dataset.dsmode; shB.innerHTML=dvRender(); }
 else if(t=e.target.closest('[data-dsback]')){ if(DV.back!=null){ shB.innerHTML=DV.back; DV.back=null; } shB.scrollTop=0; if(CUR&&CUR.id==='dictionary') wireDD(); }
});
var COPY={
 ai:{sub:'Ask across every module',
  what:'<h3>In one sentence</h3><p>An analyst that has already read every bill, tariff and forecast in the fabric and can answer in plain language, naming the module each number came from.</p><h3>How it works</h3><p>It does not invent figures. It calls the same functions the tiles use — site detail, tariff fit, anomalies, forecasts — and reports what they return. You can pick the runtime in Settings: Claude, CAPRA (Ask Sage), STARK or a local engine through the launcher relay.</p>',
  why:'<p>Most of the day is spent finding the number, not judging it. Ask “which Norfolk accounts are billed above tariff this quarter” and the lookup is done; your time goes to deciding what to do.</p><p>Because it cites the module, a colleague can reproduce the answer by opening that tile. That is the difference between an assistant and a black box.</p>',
  learn:STEPS(['Ask something you already know: “what tariff is the main-base electric account on?”','Ask the follow-up you would ask a person: “is that the best fit?”','Open the tile it names and confirm the figure yourself. Do this twice and you will trust it for the third.']),
  data:PILLS([['Loaded bills','ok'],['Tariff library','ok'],['Forecast runs','ok'],['Source allow-list','wait']])+'<p class="note">The allow-list of authoritative references (PUCs, vendor systems, EIA, S&amp;P, NOAA) is the control stakeholders asked for; it is being added to Settings in v1.9.</p>'},
 portfolio:{sub:'The UTRMS roll-up, with drill-downs',
  what:'<h3>In one sentence</h3><p>Enterprise spend, consumption and savings by region, installation and commodity — the views you use in Tableau today, with a drill-down from any number to the bills behind it.</p><h3>What is on screen</h3>'+L(['Trailing-twelve-month cost and units per installation','Posture flags: on track, watch, action','Savings realised against the ledger','Commodity split: electric, gas, water, sewer']),
  why:'<p>Your morning check becomes one screen. The posture flag tells you where to look first; the drill-down takes you to the account and the bill without leaving the view.</p><p>If your current dashboard answers a question this one cannot, that gap is the most useful thing you can tell the team.</p>',
  learn:STEPS(['Find your installation on the list','Tap the TTM cost and follow it down to the account','Compare the posture flag with what you already know about that site']),
  data:PILLS([['EDW/BIMS line items','ok'],['Savings ledger','ok'],['Interim Tableau/EDW feed','wait']])},
 tariff:{sub:'Structured tariffs, best-fit ranking',
  what:'<h3>In one sentence</h3><p>Tariffs stored as parts — customer charge, energy blocks, demand with ratchet, time-of-use periods, riders — so any account can be re-rated under every eligible schedule and the best fit ranked.</p><h3>Also</h3>'+L(['Paste a tariff sheet and it parses into structure','Watches rate-case effective dates so expected bills update on the day','Pulls commercial schedules from the OpenEI Utility Rate Database']),
  why:'<p>Hand-maintained rate sheets are where quiet errors live. Re-rating every account under every option turns “are we on the right tariff?” from a yearly project into a standing answer.</p><p>Trust is earned one check at a time: confirm the engine picks the schedule the FEC actually bills under, and you have validated both the parser and the mapping.</p>',
  learn:STEPS(['Pick an account you know the tariff for','Read the best-fit ranking and the dollar delta to the runner-up','Open the tariff and read the components — nothing is hidden in a rate']),
  data:PILLS([['UTRMS tariffs','wait'],['OpenEI URDB','ext'],['Rate-case register','wait']])+'<p class="note">Rate-case tracking is deferred until an authoritative source exists; the engine will accept a simple register (utility, docket, filed, requested change, status, effective) when one is agreed.</p>'},
 forecast:{sub:'Trend, seasonality, Monte Carlo bands',
  what:'<h3>In one sentence</h3><p>Fits trend and seasonality to your history, layers scenario drivers — fuel, rate cases, inflation, volatility — and runs hundreds of paths to give P10 / P50 / P90 rate and cost bands by month.</p><h3>Weather</h3><p>NOAA degree-days normalise consumption so a cold winter does not look like a billing error, and a mild one does not look like savings.</p>',
  why:'<p>Budget questions come with a date attached. A band with a stated confidence is a defensible answer; a single point is a guess with a decimal place.</p><p>The fit ignores points that look like billing anomalies, so a double bill in March does not steer next year’s forecast.</p>',
  learn:STEPS(['Choose an account with two or more years of history','Move the fuel-drift slider and watch the band widen','Export the P50 series and compare with your last budget submission']),
  data:PILLS([['3+ years history','wait'],['NOAA degree-days','ext'],['EIA benchmarks','ext']])},
 anomaly:{sub:'Every bill scored 0–1, with the reason',
  what:'<h3>In one sentence</h3><p>Each bill is scored for anomaly likelihood from four signals — unit rate, consumption, demand and the variance between what was billed and what the tariff says it should be — and the strongest signal is named as the hypothesis.</p><h3>Hypotheses it writes</h3>'+L(['Likely duplicate or double-billed period','Consumption far outside seasonal norm — check meter multiplier','Demand charge spike — pull interval data, check ratchet','Billed above tariff — rider applied outside effective window','Billed below tariff — estimated read, expect true-up']),
  why:'<p>These are the cases you already catch by hand, found for you on the day the bill lands. Stakeholders asked for more precise flags and account-level drill-downs; that is the next change to this tile.</p><p>Disputes post their recovery to the Savings Ledger automatically, so the work you do here is counted.</p>',
  learn:STEPS(['Open the six planted errors in the sample dataset','For each, read the hypothesis before the number and see whether you agree','Mark one as reviewed and watch it leave the badge count']),
  data:PILLS([['Line-item bills','ok'],['AMI interval kWh','ok'],['Correct tariff assignment','wait']])},
 procure:{sub:'Forward curve to IGE to strategy',

function dsFormulas(){return '<p>Every calculated figure on the hub is one of the formulas below. They are written here in the same form they will take in the production data dictionary.</p>'+
 '<h3>Bill Sentinel anomaly score (ACR-04)</h3><div class="formula">for each bill, against the account’s other bills (robust statistics):\n z_rate     = |rate − median(rates)| / MAD(rates)\n z_units    = |deseasonalised units − median| / MAD\n z_demand   = |kW − median(kW)| / MAD(kW)\n z_variance = |(billed − tariff re-rating) / re-rating| / 0.04\nsquash(z)   = 1 − exp(−max(0, z − 2.2) / 2.5)      <em>→ each signal in 0..1</em>\nscore       = 0.75·max(signals) + 0.25·mean(signals)\nflagged when score ≥ 0.35; the strongest signal names the hypothesis</div><p class="note">Deseasonalising divides each month by that calendar month’s median ratio to the account median, or by the NOAA weather model when it fits (R² ≥ 0.5).</p>'+
 '<h3>Weather normalisation (ACR-03 / 04)</h3><div class="formula">fit units = a + b·HDD + c·CDD   over the account’s history\nnormalised units = units − b·(HDD − normal HDD) − c·(CDD − normal CDD)</div>'+
 '<h3>Benchmark gap (ACR-12)</h3><div class="formula">effective rate = trailing-12-month cost ÷ trailing-12-month units\nbenchmark      = mean of last 12 EIA state commercial prices\ngap            = effective ÷ benchmark − 1\ngap in dollars = (effective − benchmark) × units</div>'+
 '<h3>Rate-pressure index, 0–100 (ACR-12)</h3><div class="formula">pending  = Σ estimated % of open and future-effective rate cases   → clamp(pending / 10%)     weight 35\nyoy      = TTM effective rate ÷ prior-12 effective rate − 1          → clamp((yoy + 2%) / 10%)  weight 25\nvolatility = stdev of monthly log rate changes × √12                → clamp(vol / 28%)        weight 20\nmarket   = EIA state price, last month ÷ 13 months ago − 1           → scaled                  weight 20\nindex    = 100 × Σ(weight × scaled input)</div><p class="note">This is the methodology stakeholders asked to see written down. It is modeled today and open to amendment before it is trusted.</p>'+
 '<h3>Rate forecast (ACR-03)</h3><div class="formula">1. fit log(rate) = intercept + slope·t by least squares\n2. drop points whose residual exceeds 3 × MAD, refit    <em>billing anomalies do not steer the trend</em>\n3. add month-of-year seasonality\n4. for N paths: apply fuel drift, inflation, rate-case steps, volatility shock\n5. report P10 / P50 / P90 of rate and cost per month</div>'+
 '<h3>Tariff re-rating (ACR-02)</h3><div class="formula">expected bill = customer charge\n              + Σ energy blocks (units in block × block rate)\n              + max(billed kW, ratchet % × 12-month peak) × demand rate\n              + Σ TOU periods (share × units × period rate)\n              + Σ riders\nbest fit = eligible tariff with the lowest 12-month re-rated total</div>';}

function openTile(id){
 var t=TILES.filter(function(x){return x.id===id;})[0]; if(!t) return; CUR=t;
 document.getElementById('sh-ico').outerHTML=icoHTML(t).replace('class="ico"','class="ico" id="sh-ico"');
 document.getElementById('sh-t').textContent=t.label;
 var tabs;
 if(id==='dataset'){ document.getElementById('sh-s').textContent='ACR-14 · how the demo data is derived'; tabs=[['Derivation',dsDerive],['Sources',dsSources],['Formulas',dsFormulas],['Planted errors',dsErrors]]; }
 else if(id==='strategy'){ MMX={}; SST.sec={}; SST.sp={}; SST.rk={}; document.getElementById('sh-s').textContent='ACR-15 · 29 Oct analysis and course of action'; tabs=[['Summary',stSummary,'#e0a84e'],['Map',stMind,'#18d4f8'],['Meeting',stMeeting,'#8ab4d9'],['Gaps',stGaps,'#e05555'],['Plan',stPlan,'#a07cf0'],['Actions',stActions,'#4db88a']]; }
 else if(id==='learn'){ document.getElementById('sh-s').textContent='ACR-16 · a thirty-minute path'; tabs=[['The path',lnPath],['Why bother',lnWhy]]; }
 else if(id==='dictionary'){ DDS={q:'',dir:'asc',kinds:null,tiles:null,open:{},lt:{}}; document.getElementById('sh-s').textContent='ACR-17 · fields, metrics and terms'; tabs=[['',ddRender],['<svg class="big" viewBox="0 0 24 24" aria-label="About"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg>',ddAbout,null,'end']]; }
 else if(id==='ai'){ ASKSEL=null; var ca=COPY.ai; document.getElementById('sh-s').textContent=t.code+' · '+ca.sub; tabs=[['Ask',aiAsk],['What it does',function(){return ca.what;}],['Why it matters',function(){return ca.why;}],['Learn it',function(){return ca.learn;}],['Data',function(){return ca.data;}]]; }
 else { var c=COPY[id]; document.getElementById('sh-s').textContent=t.code+' · '+c.sub; tabs=[['What it does',function(){return c.what;}],['Why it matters',function(){return c.why;}],['Learn it',function(){return c.learn;}],['Data',function(){return c.data;}]]; }
 shSeg.innerHTML=tabs.map(function(x,i){ if(x[0]==='') return '<div class="seg-search" data-tab="'+i+'"><span class="mini">⌕</span><input id="dd-in" type="search" placeholder="Search" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Search the dictionary"><button data-ddclear="1" aria-label="Clear" style="display:none">✕</button></div>'; return '<button role="tab" data-i="'+i+'" aria-selected="'+(i===0)+'"'+(x[3]==='end'?' class="end"':'')+(x[2]?' style="--c:'+x[2]+'"':'')+(x[0].indexOf('aria-label="')>=0?' aria-label="'+x[0].split('aria-label="')[1].split('"')[0]+'"':'')+'>'+x[0]+'</button>';}).join('')+(id==='dictionary'?'<button class="seg-ico" data-ddfilt="1" aria-label="Filters"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span class="n" style="display:none"></span></button><button class="seg-ico" data-ddsort="1" aria-label="Sorted A to Z; tap for Z to A">'+ddAzIcon()+'</button>':'');
 shSeg.onclick=function(e){var b=e.target.closest('button[data-i]');if(!b)return;Array.prototype.forEach.call(shSeg.querySelectorAll('button[data-i]'),function(c){c.setAttribute('aria-selected','false');});b.setAttribute('aria-selected','true');if(b.scrollIntoView)b.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});show(tabs[+b.dataset.i][1]);};
 show(tabs[0][1]); phone.classList.add('open'); buzz();
}
function show(fn){ shB.onclick=null; shB.onchange=null; var keep=shB.scrollTop; shB.innerHTML=fn(); if(CUR&&CUR.id==='dataset') wireDS(); if(CUR&&CUR.id==='strategy'){ wireST(); shB.scrollTop=keep; } else if(CUR&&CUR.id==='dictionary'){ wireDD(); shB.scrollTop=(fn===ddRender)?keep:0; } else shB.scrollTop=0; shTop.classList.toggle('on',shB.scrollTop>320); }
function wireDS(){
 var sel=document.getElementById('ds-acct'),rng=document.getElementById('ds-m'); if(!sel) return;
 sel.onchange=function(){DSTATE.acct=sel.value;show(dsDerive);};
 rng.oninput=function(){DSTATE.ym=MONTHS[+rng.value];document.getElementById('ds-ml').textContent=DSTATE.ym;draw();};
 rng.onchange=function(){show(dsDerive);};
 draw();
}
function draw(){
 var cv=document.getElementById('ds-cv'); if(!cv) return; var ctx=cv.getContext('2d'); var W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
 var css=getComputedStyle(document.documentElement); var a=DS[DSTATE.acct]; var vals=MONTHS.map(function(ym){var b=a[ym];return b&&!b.skipped?b.total:null;});
 var mx=Math.max.apply(null,vals.filter(function(v){return v!=null;}))*1.08; var pad=14; var x=function(i){return pad+i*(W-2*pad)/(MONTHS.length-1);}, y=function(v){return H-pad-(v/mx)*(H-2*pad);};
 ctx.strokeStyle=css.getPropertyValue('--border2').trim(); ctx.lineWidth=1; [0.25,0.5,0.75].forEach(function(p){ctx.beginPath();ctx.moveTo(pad,y(mx*p));ctx.lineTo(W-pad,y(mx*p));ctx.stroke();});
 ctx.strokeStyle=css.getPropertyValue('--cyan').trim(); ctx.lineWidth=2.5; ctx.beginPath(); var pen=false;
 vals.forEach(function(v,i){ if(v==null){pen=false;return;} if(!pen){ctx.moveTo(x(i),y(v));pen=true;} else ctx.lineTo(x(i),y(v)); }); ctx.stroke();
 ctx.fillStyle=css.getPropertyValue('--red').trim();
 MONTHS.forEach(function(ym,i){var b=a[ym]; if(b&&(b.note||b.skipped)){ctx.beginPath();ctx.arc(x(i),b.skipped?H-pad:y(b.total),5,0,7);ctx.fill();}});
 var i=MONTHS.indexOf(DSTATE.ym); ctx.strokeStyle=css.getPropertyValue('--amber').trim(); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x(i),pad); ctx.lineTo(x(i),H-pad); ctx.stroke();
 ctx.fillStyle=css.getPropertyValue('--txf').trim(); ctx.font='18px '+css.getPropertyValue('--mono'); ctx.fillText(MONTHS[0],pad,H-2); ctx.textAlign='right'; ctx.fillText(MONTHS[MONTHS.length-1],W-pad,H-2); ctx.textAlign='left'; ctx.fillText('monthly bill total · red = planted error',pad,18);
}
function closeSheet(){ phone.classList.remove('open'); MMX={}; SST.sec={}; SST.sp={}; SST.rk={}; shTop.classList.remove('on'); document.getElementById('sheet').classList.remove('filt'); }
var shTop=document.getElementById('sh-top');
shB.addEventListener('scroll',function(){ shTop.classList.toggle('on',shB.scrollTop>320); },{passive:true});
shTop.onclick=function(){ shB.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); buzz(); };
document.getElementById('sh-x').onclick=closeSheet; document.getElementById('dim').onclick=closeSheet;
/* swipe-down to dismiss on the grabber */
(function(){var sy=null,sheet=document.getElementById('sheet');sheet.addEventListener('touchstart',function(e){if(shB.scrollTop>0&&e.target.closest('.sh-body'))return;sy=e.touches[0].clientY;},{passive:true});sheet.addEventListener('touchmove',function(e){if(sy==null)return;var d=e.touches[0].clientY-sy;if(d>0)sheet.style.transform='translateY('+d+'px)';},{passive:true});sheet.addEventListener('touchend',function(e){if(sy==null)return;var d=e.changedTouches[0].clientY-sy;sheet.style.transform='';if(d>110)closeSheet();sy=null;});})();

/* ─────────── hub render, tabs, routing ─────────── */
var tiles=document.getElementById('tiles');
tiles.innerHTML=TILES.map(function(t){return '<button class="tile'+(t.ring?' ring':'')+'" role="listitem" data-open="'+t.id+'" aria-label="'+t.code+' '+t.label+'">'+icoHTML(t)+'<span class="lbl">'+t.label+'</span></button>';}).join('');
document.addEventListener('click',function(e){var b=e.target.closest('[data-open]');if(b){openTile(b.dataset.open);}});

/* ─────────── chrome bits ─────────── */
function tick(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})+' local';} tick(); setInterval(tick,15000);
document.getElementById('theme').onclick=function(){var r=document.documentElement;var dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');try{localStorage.setItem('anccr-theme',dark?'light':'dark');}catch(e){} toast(dark?'Light theme':'Dark theme'); if(phone.classList.contains('open')&&CUR&&CUR.id==='dataset')draw();};
try{var th=localStorage.getItem('anccr-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}
var tt=null;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},1600);}
</script>
